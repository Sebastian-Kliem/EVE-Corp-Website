# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(DISCORD_WEBHOOK_DEFAULT): ''
    env(DISCORD_WEBHOOK_STRUCTURES): ''
    env(DISCORD_WEBHOOK_FUEL): ''
    env(DISCORD_WEBHOOK_COMBAT): ''
    env(DISCORD_WEBHOOK_USER_ALERTS): ''
    env(DISCORD_WEBHOOK_INDUSTRY): ''
    env(DISCORD_WEBHOOK_MARKET): ''
    env(DISCORD_PING_ROLE_STRUCTURE_DEFENSE): ''
    env(DISCORD_PING_ROLE_FUEL): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $eveSsoClientId: '%env(EVE_SSO_CLIENT_ID)%'
            string $eveSsoSecretKey: '%env(EVE_SSO_SECRET_KEY)%'
            string $eveSsoCallbackUrl: '%env(EVE_SSO_CALLBACK_URL)%'
            string $eveSsoScopes: '%env(EVE_SSO_SCOPES)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\Discord\DiscordWebhookService:
        arguments:
            $defaultWebhook: '%env(DISCORD_WEBHOOK_DEFAULT)%'
            $structuresWebhook: '%env(DISCORD_WEBHOOK_STRUCTURES)%'
            $fuelWebhook: '%env(DISCORD_WEBHOOK_FUEL)%'
            $combatWebhook: '%env(DISCORD_WEBHOOK_COMBAT)%'
            $userAlertsWebhook: '%env(DISCORD_WEBHOOK_USER_ALERTS)%'
            $industryWebhook: '%env(DISCORD_WEBHOOK_INDUSTRY)%'
            $marketWebhook: '%env(DISCORD_WEBHOOK_MARKET)%'
            $structureDefensePingRole: '%env(DISCORD_PING_ROLE_STRUCTURE_DEFENSE)%'
            $fuelPingRole: '%env(DISCORD_PING_ROLE_FUEL)%'
