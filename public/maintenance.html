<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <!-- Served by nginx with HTTP 503 while pull.sh deploys; must not depend on app assets -->
    <meta http-equiv="refresh" content="20">
    <title>Wartung - Keepers of Duat</title>
    <style>
        :root {
            --eve-bg: #06070d;
            --eve-card: #141b2b;
            --eve-primary: #00f0ff;
            --eve-text: #f8fafc;
            --eve-muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: var(--eve-bg);
            color: var(--eve-text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main {
            max-width: 460px;
            width: 100%;
            padding: 32px 28px;
            background: var(--eve-card);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            text-align: center;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 1.4rem;
            color: var(--eve-primary);
            letter-spacing: 0.02em;
        }
        p {
            margin: 0 0 8px;
            line-height: 1.5;
            color: var(--eve-muted);
        }
        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 20px;
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top-color: var(--eve-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }
    </style>
</head>
<body>
    <main>
        <div class="spinner" aria-hidden="true"></div>
        <h1>Update wird eingespielt</h1>
        <p>Keepers of Duat wird gerade aktualisiert. Das dauert in der Regel weniger als eine Minute.</p>
        <p>Die Seite lädt automatisch neu.</p>
    </main>
</body>
</html>
